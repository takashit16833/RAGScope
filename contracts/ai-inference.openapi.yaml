openapi: 3.1.0
info:
  title: RAGScope AI Inference Service
  version: 0.1.0
paths:
  /v1/embedding-profiles/{profileId}:
    get:
      operationId: getEmbeddingProfile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Embedding profile metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingProfile"
        "404":
          description: Unknown profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/embeddings:
    post:
      operationId: generateEmbeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingRequest"
      responses:
        "200":
          description: Embeddings generated for every request item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingResponse"
        "400":
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown embedding profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Input cannot be processed by the selected profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Service is temporarily overloaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Model or inference runtime is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    EmbeddingProfile:
      type: object
      additionalProperties: false
      required: [profile_id, profile_fingerprint, model_id, model_revision, tokenizer_id, tokenizer_revision, pooling, max_input_tokens, truncation, normalize_vector, dimension, document_prefix, question_prefix]
      properties:
        profile_id: {type: string, minLength: 1}
        profile_fingerprint: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        model_id: {type: string, minLength: 1}
        model_revision: {type: string, minLength: 1}
        tokenizer_id: {type: string, minLength: 1}
        tokenizer_revision: {type: string, minLength: 1}
        pooling: {type: string, minLength: 1}
        max_input_tokens: {type: integer, minimum: 1}
        truncation: {type: boolean}
        normalize_vector: {type: boolean}
        dimension: {type: integer, minimum: 1}
        document_prefix: {type: string}
        question_prefix: {type: string}
    EmbeddingRequest:
      type: object
      additionalProperties: false
      required: [profile_id, input_kind, items]
      properties:
        profile_id: {type: string, minLength: 1}
        input_kind:
          type: string
          enum: [document, question]
        items:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/EmbeddingInputItem"}
    EmbeddingInputItem:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id: {type: string, minLength: 1}
        text: {type: string, minLength: 1}
    EmbeddingResponse:
      type: object
      additionalProperties: false
      required: [profile_id, profile_fingerprint, dimension, items]
      properties:
        profile_id: {type: string, minLength: 1}
        profile_fingerprint: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        dimension: {type: integer, minimum: 1}
        items:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/EmbeddingOutputItem"}
    EmbeddingOutputItem:
      type: object
      additionalProperties: false
      required: [id, vector]
      properties:
        id: {type: string, minLength: 1}
        vector:
          type: array
          minItems: 1
          items: {type: number}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string, minLength: 1}
        message: {type: string, minLength: 1}
