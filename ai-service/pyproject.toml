[project]
name = "ragscope-ai-service"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.16.0",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.ruff]
cache-dir = "~/.cache/ruff/ragscope-ai-service"

[tool.pytest.ini_options]
cache_dir = "$HOME/.cache/pytest/ragscope-ai-service"
