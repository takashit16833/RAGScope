services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        GHC_VERSION: 9.12.4
        CABAL_VERSION: 3.16.1.0
        HLS_VERSION: 2.14.0.0
        CABAL_GILD_VERSION: 1.7.0.2
        FOURMOLU_VERSION: 0.19.0.1
    init: true
    command: sleep infinity
    working_dir: /workspaces/RAGScope
    volumes:
      - .:/workspaces/RAGScope:cached
      - cabal-cache:/home/vscode/.cabal

volumes:
  cabal-cache:
