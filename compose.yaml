services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        GHC_VERSION: 9.12.4
        CABAL_VERSION: 3.16.1.0
        HLS_VERSION: 2.14.0.0
        CABAL_GILD_VERSION: 1.7.0.2
        FOURMOLU_VERSION: 0.19.0.1

    init: true
    command: sleep infinity
    working_dir: /workspaces/RAGScope

    volumes:
      # mainとlinked worktreeを同じ相対配置で参照できるよう、
      # 現在のworktreeではなく共通の親ディレクトリをマウントする。
      - ..:/workspaces/RAGScope:cached

      # MacごとのGit identityはrepository管理せず、read-onlyでコンテナへ渡す。
      - ${HOME}/.gitconfig.local:/home/vscode/.gitconfig.local:ro

      - cabal-cache:/home/vscode/.cabal

  ai-workspace:
    build:
      context: .
      dockerfile: .devcontainer/ai-service/Dockerfile
      args:
        UV_VERSION: 0.12.0

    init: true
    command: sleep infinity
    working_dir: /workspaces/RAGScope

    environment:
      UV_CACHE_DIR: /home/vscode/.cache/uv
      UV_PROJECT_ENVIRONMENT: /home/vscode/.venvs/ragscope-ai-service
      PYTHONDONTWRITEBYTECODE: "1"

    volumes:
      # RAGScopeアプリケーションと同じworktree配置を参照する。
      - ..:/workspaces/RAGScope:cached

      # MacごとのGit identityはrepository管理せず、read-onlyでコンテナへ渡す。
      - ${HOME}/.gitconfig.local:/home/vscode/.gitconfig.local:ro

      # Python依存と各ツールのキャッシュ、仮想環境をMac側のソースツリーへ作らない。
      - ai-cache:/home/vscode/.cache
      - ai-venvs:/home/vscode/.venvs

volumes:
  cabal-cache:
  ai-cache:
  ai-venvs:
