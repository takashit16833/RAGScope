services:
  workspace:
    environment:
      # GitHubへのSSH認証では、MacからColima VMへforwardされたSSH agentを利用する。
      SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock

    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        GHC_VERSION: 9.12.4
        CABAL_VERSION: 3.16.1.0
        HLS_VERSION: 2.14.0.0
        CABAL_GILD_VERSION: 1.7.0.2
        FOURMOLU_VERSION: 0.19.0.1

    init: true
    command: sleep infinity
    working_dir: /workspaces/RAGScope

    volumes:
      # mainとlinked worktreeを同じ相対配置で参照できるよう、
      # 現在のworktreeではなく共通の親ディレクトリをマウントする。
      - ..:/workspaces/RAGScope:cached

      # MacごとのGit identityはrepository管理せず、read-onlyでコンテナへ渡す。
      - ${HOME}/.gitconfig.local:/home/vscode/.gitconfig.local:ro

      - cabal-cache:/home/vscode/.cabal

      # Colima VM上のSSH agent socketをコンテナへmountし、秘密鍵をコンテナへ置かずに認証する。
      - /run/host-services/ssh-auth.sock:/run/host-services/ssh-auth.sock

volumes:
  cabal-cache:
